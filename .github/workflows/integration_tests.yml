name: Integration tests
on: push

jobs:
  container-job:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tagging
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: tagging

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          virtualenvs-path: .venv
          installer-parallel: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --with dev --no-interaction

      # -----
      # MySQL
      # -----
      - name: Install OS dependencies for MySQL
        run: sudo apt-get update && sudo apt-get -y install -y gcc default-libmysqlclient-dev

      - name: Install Python dependencies for MySQL
        run: poetry run pip install mysqlclient

      - name: Run MySQL tests
        run: poetry run pytest
        env:
          DATABASE_ENGINE: mysql

      # -----
      # PostgreSQL
      # -----
      - name: Install Python dependencies for PostgreSQL
        run: poetry run pip install psycopg2-binary

      - name: Run Postgresql tests
        run: poetry run pytest
        env:
          DATABASE_ENGINE: postgres
